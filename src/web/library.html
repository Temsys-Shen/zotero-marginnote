<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Zotero Connector - Library</title>
    <link rel="stylesheet" href="common.css">
    <script src="i18n.js"></script>
</head>

<body>

    <header>
        <div class="view-switcher">
            <span class="view-option active" data-view="library" role="button">Library</span>
            <span class="view-option" data-view="favorites" role="button">Favorites</span>
            <span class="view-option" data-view="selected" role="button">Literature Cards</span>
            <span class="view-option" data-view="settings" role="button">Settings</span>
        </div>
    </header>

    <div id="library-layout">
        <div id="sidebar">
            <div id="collections-container">
                <div class="sidebar-header">Collections</div>
                <div id="collections-tree"></div>
            </div>
            <div id="sidebar-v-resizer"></div>
            <div id="tags-container">
                <div class="sidebar-header">Tags</div>
                <div class="tag-search-bar">
                    <input type="text" id="tag-filter-input" placeholder="Filter tags...">
                </div>
                <div id="tags-list"></div>
                <div id="tags-loading-mask" class="hidden"></div>
            </div>
        </div>
        
        <div id="sidebar-resizer">
            <div id="sidebar-toggle-btn" title="Toggle Sidebar">◀</div>
        </div>

        <div id="main-content">
            <div class="search-bar">
                <input id="q" placeholder="Keywords (Title, Author, Year)..." onkeydown="event.key=='Enter'&&run()">
                <button id="btn" onclick="run()">Search</button>
            </div>
                <div class="library-toolbar">
                    <div class="toolbar-left">
                        <div class="dropdown-wrapper">
                            <button id="sort-trigger" class="toolbar-btn" type="button"></button>
                            <div id="sort-menu" class="dropdown-menu hidden"></div>
                    </div>
                    <div class="dropdown-wrapper">
                        <button id="filter-trigger" class="toolbar-btn" type="button"></button>
                        <div id="filter-menu" class="dropdown-menu filter-menu hidden">
                            <div class="filter-group">
                                <div class="filter-group-title" id="filter-item-type-label"></div>
                                <div class="custom-select" data-select-id="filter-item-type">
                                    <button id="filter-item-type-trigger" class="custom-select-trigger" type="button"></button>
                                    <div id="filter-item-type-options" class="custom-select-options hidden"></div>
                                </div>
                            </div>
                            <div class="filter-group filter-year-grid">
                                <div>
                                    <div class="filter-group-title" id="filter-year-from-label"></div>
                                    <div class="custom-select" data-select-id="filter-year-from">
                                        <button id="filter-year-from-trigger" class="custom-select-trigger year-trigger" type="button"></button>
                                        <div id="filter-year-from-options" class="custom-select-options hidden"></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="filter-group-title" id="filter-year-to-label"></div>
                                    <div class="custom-select" data-select-id="filter-year-to">
                                        <button id="filter-year-to-trigger" class="custom-select-trigger year-trigger" type="button"></button>
                                        <div id="filter-year-to-options" class="custom-select-options hidden"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="filter-group">
                                <label class="filter-check-row">
                                    <input id="filter-has-tag" type="checkbox">
                                    <span id="filter-has-tag-label"></span>
                                </label>
                                <label class="filter-check-row">
                                    <input id="filter-has-doi" type="checkbox">
                                    <span id="filter-has-doi-label"></span>
                                </label>
                            </div>
                            <div class="filter-actions-row">
                                <button id="filter-reset-btn" class="toolbar-btn secondary" type="button"></button>
                                <button id="filter-apply-btn" class="toolbar-btn primary" type="button"></button>
                            </div>
                            </div>
                        </div>
                        <button id="library-clear-selection" class="toolbar-btn" type="button" disabled></button>
                        <div class="batch-import-group">
                            <button id="library-batch-import" class="toolbar-btn" type="button" disabled></button>
                            <button id="library-batch-options" class="toolbar-btn" type="button">▾</button>
                            <div id="library-batch-options-menu" class="batch-options-menu hidden">
                                <label id="library-label-import-card"><input type="checkbox" id="library-opt-import-card" checked>文献卡片</label>
                                <label id="library-label-import-pdf"><input type="checkbox" id="library-opt-import-pdf">PDF</label>
                                <label id="library-label-import-annotation"><input type="checkbox" id="library-opt-import-annotation">导入标注</label>
                            </div>
                        </div>
                    </div>
                    <div id="library-result-count" class="library-result-count"></div>
                </div>
            <div id="active-filter-summary" class="active-filter-summary hidden"></div>
            <div id="content-area">
                <div id="log">Ready to search.</div>
                <div id="out"></div>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="onboarding.js"></script>
    <script>
        // 初始化 HTML 静态文本
        (function() {
            // View switcher
            var viewOptions = document.querySelectorAll('.view-option');
            viewOptions.forEach(function(opt, idx) {
                var values = [T('library'), T('favorites'), T('selected_cards'), T('settings')];
                if (idx < values.length) opt.textContent = values[idx];
            });

            // Search bar
            var qInput = document.getElementById('q');
            if (qInput) qInput.placeholder = T('search_placeholder');

            var searchBtn = document.getElementById('btn');
            if (searchBtn) searchBtn.textContent = T('search_button');

            var sortBtn = document.getElementById('sort-trigger');
            if (sortBtn) sortBtn.textContent = T('sort_button');
            var filterBtn = document.getElementById('filter-trigger');
            if (filterBtn) filterBtn.textContent = T('filter_button');
            var itemTypeLabel = document.getElementById('filter-item-type-label');
            if (itemTypeLabel) itemTypeLabel.textContent = T('filter_item_type');
            var filterYearFromLabel = document.getElementById('filter-year-from-label');
            if (filterYearFromLabel) filterYearFromLabel.textContent = T('filter_year_from');
            var filterYearToLabel = document.getElementById('filter-year-to-label');
            if (filterYearToLabel) filterYearToLabel.textContent = T('filter_year_to');
            var filterHasTagLabel = document.getElementById('filter-has-tag-label');
            if (filterHasTagLabel) filterHasTagLabel.textContent = T('filter_has_tag');
            var filterHasDoiLabel = document.getElementById('filter-has-doi-label');
            if (filterHasDoiLabel) filterHasDoiLabel.textContent = T('filter_has_doi');
            var filterResetBtn = document.getElementById('filter-reset-btn');
            if (filterResetBtn) filterResetBtn.textContent = T('filter_reset');
            var filterApplyBtn = document.getElementById('filter-apply-btn');
            if (filterApplyBtn) filterApplyBtn.textContent = T('filter_apply');
            var libraryBatchImportBtn = document.getElementById('library-batch-import');
            if (libraryBatchImportBtn) libraryBatchImportBtn.textContent = T('batch_import');
            function setImportLabelText(labelId, text) {
                var label = document.getElementById(labelId);
                if (!label) return;
                var input = label.querySelector('input');
                if (!input) return;
                while (label.childNodes.length > 1) label.removeChild(label.lastChild);
                label.appendChild(document.createTextNode(text));
            }
            setImportLabelText('library-label-import-card', T('selected_cards'));
            setImportLabelText('library-label-import-pdf', 'PDF');
            setImportLabelText('library-label-import-annotation', T('import_annotations'));
            var libraryClearSelectionBtn = document.getElementById('library-clear-selection');
            if (libraryClearSelectionBtn) libraryClearSelectionBtn.textContent = T('clear_selection');
            // Log
            var logDiv = document.getElementById('log');
            if (logDiv) logDiv.textContent = T('ready_to_search');
        })();

        // View switcher logic
        (function initSwitcher() {
            var viewOptions = document.querySelectorAll('.view-option[data-view]');
            viewOptions.forEach(function(el) {
                el.addEventListener('click', function() {
                    var view = this.getAttribute('data-view');

                    // Update active state
                    viewOptions.forEach(function(opt) {
                        opt.classList.remove('active');
                    });
                    this.classList.add('active');

                    // Switch views
                    if (view === 'library') {
                        // Already on library page
                    } else if (view === 'favorites') {
                        window.location.href = 'favorites.html';
                    } else if (view === 'selected') {
                        window.location.href = 'selection.html';
                    } else if (view === 'settings') {
                        window.location.href = 'settings.html';
                    }
                });
            });
        })();
    </script>
    <script>
        window.MNCurrentCollection = '';
        window.MNSelectedTags = [];
        window.MNAllTags = [];
        window.MNAvailableTagsSet = null;
        window.MNFavoritesSet = new Set();
        window.__mnFavoritesResolver = null;
        window.MNLibrarySelectionState = {
            selectedKeys: {},
            batch: { card: true, pdf: false, annotation: false },
            visibleItemKeys: []
        };
        
        var MN_ITEM_TYPE_OPTIONS = [
            { value: 'all', labelKey: 'filter_item_type_all' },
            { value: 'artwork', label: 'Artwork' },
            { value: 'audioRecording', label: 'Audio Recording' },
            { value: 'bill', label: 'Bill' },
            { value: 'blogPost', label: 'Blog Post' },
            { value: 'book', label: 'Book' },
            { value: 'bookSection', label: 'Book Section' },
            { value: 'case', label: 'Case' },
            { value: 'conferencePaper', label: 'Conference Paper' },
            { value: 'dataset', label: 'Dataset' },
            { value: 'dictionaryEntry', label: 'Dictionary Entry' },
            { value: 'document', label: 'Document' },
            { value: 'email', label: 'E-mail' },
            { value: 'encyclopediaArticle', label: 'Encyclopedia Article' },
            { value: 'film', label: 'Film' },
            { value: 'forumPost', label: 'Forum Post' },
            { value: 'hearing', label: 'Hearing' },
            { value: 'instantMessage', label: 'Instant Message' },
            { value: 'interview', label: 'Interview' },
            { value: 'journalArticle', label: 'Journal Article' },
            { value: 'letter', label: 'Letter' },
            { value: 'magazineArticle', label: 'Magazine Article' },
            { value: 'manuscript', label: 'Manuscript' },
            { value: 'map', label: 'Map' },
            { value: 'newspaperArticle', label: 'Newspaper Article' },
            { value: 'patent', label: 'Patent' },
            { value: 'podcast', label: 'Podcast' },
            { value: 'preprint', label: 'Preprint' },
            { value: 'presentation', label: 'Presentation' },
            { value: 'radioBroadcast', label: 'Radio Broadcast' },
            { value: 'report', label: 'Report' },
            { value: 'computerProgram', label: 'Software' },
            { value: 'standard', label: 'Standard' },
            { value: 'statute', label: 'Statute' },
            { value: 'tvBroadcast', label: 'TV Broadcast' },
            { value: 'thesis', label: 'Thesis' },
            { value: 'videoRecording', label: 'Video Recording' },
            { value: 'webpage', label: 'Web Page' }
        ];
        window.MNLibraryControls = {
            sort: 'year_desc',
            filters: {
                itemType: 'all',
                yearFrom: '',
                yearTo: '',
                hasTag: false,
                hasDoi: false
            }
        };

        function getItemTypeLabel(typeValue) {
            var val = String(typeValue || 'all');
            var found = MN_ITEM_TYPE_OPTIONS.find(function(opt) { return opt.value === val; });
            if (!found) return val;
            if (found.labelKey) return T(found.labelKey);
            return found.label || val;
        }

        function isInteractiveTarget(target) {
            if (!target || typeof target.closest !== 'function') return false;
            return !!target.closest('input, button, a, select, textarea, label');
        }

        function getLibrarySelectedItemKeys() {
            return Object.keys(window.MNLibrarySelectionState.selectedKeys).filter(function(key) {
                return !!window.MNLibrarySelectionState.selectedKeys[key];
            });
        }

        function syncLibrarySelectedRows() {
            var rows = document.querySelectorAll('#out .list-item[data-item-key]');
            Array.prototype.forEach.call(rows, function(row) {
                var key = row.getAttribute('data-item-key') || '';
                row.classList.toggle('is-selected', !!window.MNLibrarySelectionState.selectedKeys[key]);
            });
        }

        function updateLibraryBatchImportState() {
            var batchBtn = $('library-batch-import');
            var clearBtn = $('library-clear-selection');
            var hasSelected = getLibrarySelectedItemKeys().length > 0;
            if (batchBtn) batchBtn.disabled = !hasSelected;
            if (clearBtn) clearBtn.disabled = !hasSelected;
        }

        function setLibrarySelectionByKey(key, selected) {
            if (!key) return;
            window.MNLibrarySelectionState.selectedKeys[key] = !!selected;
            syncLibrarySelectedRows();
            updateLibraryBatchImportState();
        }

        function toggleLibrarySelectionByKey(key) {
            if (!key) return;
            setLibrarySelectionByKey(key, !window.MNLibrarySelectionState.selectedKeys[key]);
        }

        function clearLibrarySelection() {
            window.MNLibrarySelectionState.selectedKeys = {};
            syncLibrarySelectedRows();
            updateLibraryBatchImportState();
        }

        function syncLibraryBatchOptionState() {
            var state = window.MNLibrarySelectionState.batch;
            state.card = !!$('library-opt-import-card').checked;
            state.pdf = !!$('library-opt-import-pdf').checked;
            if (!state.card) {
                $('library-opt-import-annotation').checked = false;
                $('library-opt-import-annotation').disabled = true;
                state.annotation = false;
            } else {
                $('library-opt-import-annotation').disabled = false;
                state.annotation = !!$('library-opt-import-annotation').checked;
            }
        }

        function readLibraryEntryPayloadByKey(itemKey) {
            if (!itemKey) return null;
            var row = document.querySelector('#out .list-item[data-item-key="' + itemKey + '"]');
            if (!row) return null;
            var payloadRaw = row.getAttribute('data-favorite-entry') || '';
            if (!payloadRaw) return null;
            try {
                return JSON.parse(decodeURIComponent(payloadRaw));
            } catch (e) {
                console.log('parse library entry payload failed: ' + itemKey + ' ' + e);
                return null;
            }
        }

        function runLibraryBatchImport() {
            var keys = getLibrarySelectedItemKeys();
            if (!keys.length) return;
            syncLibraryBatchOptionState();
            var items = keys.map(function(key) {
                var entry = readLibraryEntryPayloadByKey(key);
                if (!entry) return null;
                var clone = JSON.parse(JSON.stringify(entry));
                if (!clone.createNoteQuery) {
                    var createUrl = buildCreateNoteUrl(
                        (clone.snapshot && clone.snapshot.title) || T('Untitled'),
                        clone.snapshot && clone.snapshot.itemType,
                        ((clone.snapshot && clone.snapshot.date) || '').substring(0, 4),
                        clone.author || T('unknown'),
                        'zotero://select/library/items/' + (clone.itemKey || ''),
                        '',
                        'https://www.zotero.org/' + ((clone.slug || 'user')) + '/items/' + (clone.itemKey || ''),
                        '',
                        clone.itemKey || '',
                        'C',
                        clone.uid || '',
                        clone.apiKey || '',
                        clone.snapshot || {},
                        getFieldTemplates()
                    );
                    clone.createNoteQuery = createUrl.indexOf('?') > -1 ? createUrl.split('?')[1] : '';
                }
                return clone;
            }).filter(Boolean);
            if (!items.length) return;
            var payload = { options: window.MNLibrarySelectionState.batch, items: items };
            sendMNProtocol('mnzotero://favorites?action=batchImport&payload=' + encodeURIComponent(JSON.stringify(payload)));
        }

        function renderItemTypeOptions() {
            var optionsEl = $('filter-item-type-options');
            if (!optionsEl) return;
            var currentValue = String(window.MNLibraryControls.filters.itemType || 'all');
            var html = MN_ITEM_TYPE_OPTIONS.map(function(opt) {
                var label = opt.labelKey ? T(opt.labelKey) : (opt.label || opt.value);
                return '<button type="button" class="custom-select-option" data-select-id="filter-item-type" data-value="' + escapeHtml(opt.value) + '">' + escapeHtml(label) + '</button>';
            }).join('');
            optionsEl.innerHTML = html;
            setCustomSelectValue('filter-item-type', currentValue);
        }

        function cloneFilterState(filters) {
            return {
                itemType: filters && filters.itemType ? String(filters.itemType) : 'all',
                yearFrom: filters && filters.yearFrom ? String(filters.yearFrom) : '',
                yearTo: filters && filters.yearTo ? String(filters.yearTo) : '',
                hasTag: !!(filters && filters.hasTag),
                hasDoi: !!(filters && filters.hasDoi)
            };
        }

        function getCustomSelectOptions(selectId) {
            return document.querySelectorAll('.custom-select-option[data-select-id="' + selectId + '"]');
        }

        function closeAllCustomSelectOptions() {
            var optionPanels = document.querySelectorAll('.custom-select-options');
            optionPanels.forEach(function(panel) {
                panel.classList.add('hidden');
            });
            var triggers = document.querySelectorAll('.custom-select-trigger');
            triggers.forEach(function(trigger) {
                trigger.classList.remove('open');
            });
        }

        function openCustomSelectOptions(selectId) {
            closeAllCustomSelectOptions();
            var panel = $(selectId + '-options');
            var trigger = $(selectId + '-trigger');
            if (!panel || !trigger) return;
            panel.classList.remove('hidden');
            trigger.classList.add('open');
        }

        function setCustomSelectValue(selectId, value) {
            var stringValue = String(value || '');
            var trigger = $(selectId + '-trigger');
            var options = getCustomSelectOptions(selectId);
            var found = false;
            options.forEach(function(opt) {
                var isSelected = (opt.getAttribute('data-value') || '') === stringValue;
                opt.classList.toggle('selected', isSelected);
                if (isSelected) {
                    found = true;
                    if (trigger) trigger.textContent = opt.textContent || '';
                }
            });
            if (!found && options.length > 0) {
                options[0].classList.add('selected');
                if (trigger) trigger.textContent = options[0].textContent || '';
            }
            if (trigger) {
                var nextValue = found ? stringValue : (options[0] ? (options[0].getAttribute('data-value') || '') : '');
                trigger.setAttribute('data-value', nextValue);
            }
        }

        function getCustomSelectValue(selectId) {
            var trigger = $(selectId + '-trigger');
            if (!trigger) return '';
            return String(trigger.getAttribute('data-value') || '');
        }

        function renderYearOptions() {
            var fromOptionsEl = $('filter-year-from-options');
            var toOptionsEl = $('filter-year-to-options');
            if (!fromOptionsEl || !toOptionsEl) return;
            var currentYear = (new Date()).getFullYear();
            var startYear = currentYear - 80;
            var anyYearLabel = T('filter_year_any');
            var html = '<button type="button" class="custom-select-option" data-select-id="filter-year-from" data-value="">' + escapeHtml(anyYearLabel) + '</button>';
            for (var y = currentYear; y >= startYear; y--) {
                var yearStr = String(y);
                html += '<button type="button" class="custom-select-option" data-select-id="filter-year-from" data-value="' + yearStr + '">' + yearStr + '</button>';
            }
            fromOptionsEl.innerHTML = html;
            var htmlTo = '<button type="button" class="custom-select-option" data-select-id="filter-year-to" data-value="">' + escapeHtml(anyYearLabel) + '</button>';
            for (var yy = currentYear; yy >= startYear; yy--) {
                var yearToStr = String(yy);
                htmlTo += '<button type="button" class="custom-select-option" data-select-id="filter-year-to" data-value="' + yearToStr + '">' + yearToStr + '</button>';
            }
            toOptionsEl.innerHTML = htmlTo;
            setCustomSelectValue('filter-year-from', String(window.MNLibraryControls.filters.yearFrom || ''));
            setCustomSelectValue('filter-year-to', String(window.MNLibraryControls.filters.yearTo || ''));
        }

        function getSortOptions() {
            return [
                { key: 'added_desc', label: T('sort_added_desc') },
                { key: 'added_asc', label: T('sort_added_asc') },
                { key: 'year_desc', label: T('sort_year_desc') },
                { key: 'year_asc', label: T('sort_year_asc') },
                { key: 'title_asc', label: T('sort_title_asc') },
                { key: 'author_asc', label: T('sort_author_asc') }
            ];
        }

        function getSortLabel(sortKey) {
            var options = getSortOptions();
            var found = options.find(function(opt) { return opt.key === sortKey; });
            return found ? found.label : options[0].label;
        }

        function extractYearNumber(rawDate) {
            var text = String(rawDate || '');
            var match = text.match(/(\d{4})/);
            if (!match) return 0;
            var parsed = Number(match[1]);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function extractTimestamp(rawDateTime) {
            var text = String(rawDateTime || '').trim();
            if (!text) return 0;
            var parsed = Date.parse(text);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function getLibraryItemMeta(item) {
            var data = item && item.data ? item.data : {};
            var creators = Array.isArray(data.creators) ? data.creators : [];
            var firstCreator = creators.length ? creators[0] : null;
            var author = (firstCreator && (firstCreator.lastName || firstCreator.name)) || '';
            var tags = Array.isArray(data.tags) ? data.tags : [];
            var year = extractYearNumber(data.date || '');
            return {
                title: String(data.title || ''),
                titleLower: String(data.title || '').toLowerCase(),
                author: String(author || ''),
                authorLower: String(author || '').toLowerCase(),
                year: year,
                dateAddedTs: extractTimestamp(data.dateAdded || ''),
                itemType: String(data.itemType || ''),
                hasTag: tags.length > 0,
                hasDoi: !!String(data.DOI || '').trim()
            };
        }

        function matchesAdvancedFilters(meta, filters) {
            if (!filters) return true;
            if (filters.itemType && filters.itemType !== 'all' && meta.itemType !== filters.itemType) return false;
            var yearFrom = Number(filters.yearFrom || 0);
            var yearTo = Number(filters.yearTo || 0);
            if (yearFrom > 0 && (meta.year <= 0 || meta.year < yearFrom)) return false;
            if (yearTo > 0 && (meta.year <= 0 || meta.year > yearTo)) return false;
            if (filters.hasTag && !meta.hasTag) return false;
            if (filters.hasDoi && !meta.hasDoi) return false;
            return true;
        }

        function sortLibraryItems(rows, sortKey) {
            var sorted = rows.slice();
            sorted.sort(function(a, b) {
                var am = a.meta;
                var bm = b.meta;
                if (sortKey === 'added_asc') {
                    return (am.dateAddedTs || 0) - (bm.dateAddedTs || 0) || am.titleLower.localeCompare(bm.titleLower);
                }
                if (sortKey === 'added_desc') {
                    return (bm.dateAddedTs || 0) - (am.dateAddedTs || 0) || am.titleLower.localeCompare(bm.titleLower);
                }
                if (sortKey === 'year_asc') {
                    return (am.year || 0) - (bm.year || 0) || am.titleLower.localeCompare(bm.titleLower);
                }
                if (sortKey === 'title_asc') {
                    return am.titleLower.localeCompare(bm.titleLower) || (bm.year || 0) - (am.year || 0);
                }
                if (sortKey === 'author_asc') {
                    return am.authorLower.localeCompare(bm.authorLower) || am.titleLower.localeCompare(bm.titleLower);
                }
                return (bm.year || 0) - (am.year || 0) || am.titleLower.localeCompare(bm.titleLower);
            });
            return sorted;
        }

        function renderSortMenu() {
            var menu = $('sort-menu');
            if (!menu) return;
            var state = window.MNLibraryControls || {};
            var html = getSortOptions().map(function(opt) {
                var selectedClass = state.sort === opt.key ? ' selected' : '';
                return '<button type="button" class="sort-menu-item' + selectedClass + '" data-sort-key="' + escapeHtml(opt.key) + '">' + escapeHtml(opt.label) + '</button>';
            }).join('');
            menu.innerHTML = html;
        }

        function updateLibraryControlText() {
            var state = window.MNLibraryControls || {};
            var sortBtn = $('sort-trigger');
            if (sortBtn) sortBtn.textContent = T('sort_button');
            var filterBtn = $('filter-trigger');
            if (filterBtn) {
                var filters = state.filters || {};
                var count = 0;
                if (filters.itemType && filters.itemType !== 'all') count += 1;
                if (filters.yearFrom) count += 1;
                if (filters.yearTo) count += 1;
                if (filters.hasTag) count += 1;
                if (filters.hasDoi) count += 1;
                filterBtn.textContent = count > 0 ? (T('filter_button') + '(' + count + ')') : T('filter_button');
                filterBtn.classList.toggle('has-filter', count > 0);
            }
        }

        function openSortMenu() {
            renderSortMenu();
            var menu = $('sort-menu');
            if (!menu) return;
            menu.classList.remove('hidden');
            menu.classList.add('show');
        }

        function closeSortMenu() {
            var menu = $('sort-menu');
            if (!menu) return;

        function renderCollectionsTree(colls, container) {
            var map = {};
            var roots = [];
            
            var allItem = document.createElement('div');
            allItem.className = 'collection-item' + (window.MNCurrentCollection === '' ? ' active' : '');
            allItem.innerHTML = '<span class="collection-toggle empty"></span><span class="collection-icon">📚</span>' + escapeHtml((typeof T === 'function') ? T('all') : 'All');
            allItem.onclick = function() {
                window.MNCurrentCollection = '';
                document.querySelectorAll('.collection-item').forEach(el => el.classList.remove('active'));
                this.classList.add('active');
                run();
            };
            container.appendChild(allItem);

            colls.forEach(function(c) {
                map[c.key] = { key: c.key, name: (c.data && c.data.name) ? c.data.name : c.key, parent: c.data ? c.data.parentCollection : false, children: [] };
            });
            colls.forEach(function(c) {
                var d = map[c.key];
                if (d.parent && map[d.parent]) {
                    map[d.parent].children.push(d);
                } else {
                    roots.push(d);
                }
            });

            var ul = document.createElement('ul');
            ul.className = 'collection-tree';
            roots.forEach(function(root) {
                ul.appendChild(createCollectionNode(root));
            });
            container.appendChild(ul);
        }

        function createCollectionNode(nodeData) {
            var li = document.createElement('li');
            li.className = 'collection-node';
            
            var itemContent = document.createElement('div');
            itemContent.className = 'collection-item' + (window.MNCurrentCollection === nodeData.key ? ' active' : '');
            
            var hasChildren = nodeData.children && nodeData.children.length > 0;
            var toggle = document.createElement('span');
            toggle.className = 'collection-toggle' + (hasChildren ? '' : ' empty');
            toggle.textContent = hasChildren ? '▶' : '';
            
            var icon = document.createElement('span');
            icon.className = 'collection-icon';
            icon.textContent = '📁';
            
            var text = document.createTextNode(nodeData.name);
            
            itemContent.appendChild(toggle);
            itemContent.appendChild(icon);
            itemContent.appendChild(text);
            li.appendChild(itemContent);
            
            var childrenUl = null;
            if (hasChildren) {
                childrenUl = document.createElement('ul');
                childrenUl.className = 'collection-children';
                nodeData.children.forEach(function(child) {
                    childrenUl.appendChild(createCollectionNode(child));
                });
                li.appendChild(childrenUl);
            }
            
            toggle.onclick = function(e) {
                e.stopPropagation();
                if (hasChildren) {
                    toggle.classList.toggle('expanded');
                    childrenUl.classList.toggle('expanded');
                }
            };
            
            itemContent.onclick = function() {
                window.MNCurrentCollection = nodeData.key;
                document.querySelectorAll('.collection-item').forEach(el => el.classList.remove('active'));
                itemContent.classList.add('active');
                run();
            };
            
            return li;
        }

        function renderTagsList(availableTagsSet, searchTerm) {
            var container = $('tags-list');
            if (!container) return;
            container.innerHTML = '';
            
            var searchFocus = searchTerm ? searchTerm.toLowerCase() : '';
            var tagsToRender = window.MNAllTags || [];
            
            tagsToRender.forEach(function(tagName) {
                var isSelected = window.MNSelectedTags.includes(tagName);
                
                if (searchFocus && tagName.toLowerCase().indexOf(searchFocus) === -1) {
                    return; 
                }
                
                var isAvailable = true;
                if (availableTagsSet && !isSelected) {
                    isAvailable = availableTagsSet.has(tagName);
                }
                
                // USER REQUEST: tags不置灰，不可点的直接不显示
                if (!isSelected && !isAvailable) return;
                
                var tagEl = document.createElement('span');
                tagEl.className = 'sidebar-tag';
                if (isSelected) tagEl.classList.add('active');
                
                tagEl.textContent = tagName;
                tagEl.onclick = function() {
                    if (isSelected) {
                        window.MNSelectedTags = window.MNSelectedTags.filter(t => t !== tagName);
                    } else {
                        window.MNSelectedTags.push(tagName);
                    }
                    run();
                };
                container.appendChild(tagEl);
            });
        }

        // Sidebar Resizing & Toggle Logic
        (function initSidebarResizing() {
            var resizer = $('sidebar-resizer');
            var vResizer = $('sidebar-v-resizer');
            var sidebar = $('sidebar');
            var colContainer = $('collections-container');
            var layout = $('library-layout');
            var toggleBtn = $('sidebar-toggle-btn');
            if (!resizer || !sidebar || !colContainer) return;

            var isResizingH = false;
            var isResizingV = false;

            resizer.addEventListener('pointerdown', function(e) {
                if (e.target.id === 'sidebar-toggle-btn') return;
                isResizingH = true;
                sidebar.classList.add('resizing');
                resizer.setPointerCapture(e.pointerId);
                resizer.classList.add('active');
                document.body.style.cursor = 'col-resize';
                e.preventDefault();
            });

            vResizer.addEventListener('pointerdown', function(e) {
                isResizingV = true;
                vResizer.setPointerCapture(e.pointerId);
                vResizer.classList.add('active');
                document.body.style.cursor = 'row-resize';
                e.preventDefault();
            });

            window.addEventListener('pointermove', function(e) {
                if (isResizingH) {
                    var offsetLeft = layout.getBoundingClientRect().left;
                    var newWidth = e.clientX - offsetLeft;
                    if (newWidth >= 100 && newWidth <= 600) {
                        sidebar.style.width = newWidth + 'px';
                        sidebar.classList.remove('collapsed');
                        if (toggleBtn) toggleBtn.textContent = '◀';
                    }
                } else if (isResizingV) {
                    var offsetTop = sidebar.getBoundingClientRect().top;
                    var newHeight = e.clientY - offsetTop;
                    var minColHeight = 50;
                    var maxColHeight = sidebar.clientHeight - 80;
                    if (newHeight >= minColHeight && newHeight <= maxColHeight) {
                        colContainer.style.flex = '0 0 ' + newHeight + 'px';
                    }
                }
            });

            window.addEventListener('pointerup', function(e) {
                if (isResizingH) {
                    isResizingH = false;
                    sidebar.classList.remove('resizing');
                    resizer.releasePointerCapture(e.pointerId);
                    resizer.classList.remove('active');
                    document.body.style.cursor = '';
                }
                if (isResizingV) {
                    isResizingV = false;
                    vResizer.releasePointerCapture(e.pointerId);
                    vResizer.classList.remove('active');
                    document.body.style.cursor = '';
                }
            });
            
            window.addEventListener('pointercancel', function(e) {
                if (isResizingH) {
                    isResizingH = false;
                    sidebar.classList.remove('resizing');
                    resizer.releasePointerCapture(e.pointerId);
                    resizer.classList.remove('active');
                    document.body.style.cursor = '';
                }
                if (isResizingV) {
                    isResizingV = false;
                    vResizer.releasePointerCapture(e.pointerId);
                    vResizer.classList.remove('active');
                    document.body.style.cursor = '';
                }
            });

            if (toggleBtn) {
                toggleBtn.onclick = function() {
                    sidebar.classList.toggle('collapsed');
                    if (sidebar.classList.contains('collapsed')) {
                        toggleBtn.textContent = '▶';
                    } else {
                        toggleBtn.textContent = '◀';
                    }
                };
            }
        })();

        // 从 Zotero 数据中获取字段值
        function getZoteroFieldValue(data, field) {
            if (!data || !field) return undefined;

            switch(field) {
                case 'title':
                    return data.title || '';
                case 'author':
                    return data.creators && data.creators[0] && (data.creators[0].lastName || data.creators[0].name) || '';
                case 'year':
                    var date = data.date || '';
                    return date.substring(0, 4) || '';
                case 'type':
                    return data.itemType || '';
                case 'tags':
                    return Array.isArray(data.tags) ? data.tags.map(t => (t && t.tag) ? t.tag : t).filter(Boolean) : [];
                case 'abstractNote':
                    return data.abstractNote || '';
                case 'DOI':
                    return data.DOI || '';
                case 'ISBN':
                    return data.ISBN || '';
                case 'ISSN':
                    return data.ISSN || '';
                case 'url':
                    return data.url || '';
                case 'language':
                    return data.language || '';
                case 'publicationTitle':
                    return data.publicationTitle || '';
                case 'volume':
                    return data.volume || '';
                case 'issue':
                    return data.issue || '';
                case 'pages':
                    return data.pages || '';
                case 'thesisType':
                    return data.thesisType || '';
                case 'university':
                    return data.university || '';
                case 'extra':
                    return data.extra || '';
                case 'creators':
                    return Array.isArray(data.creators) ? data.creators.map(c => c.name || c.lastName || '') : [];
                default:
                    if (data[field] !== undefined && data[field] !== null) return data[field];
                    return undefined;
            }
        }

        // HTML转义函数
        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // 渲染单个字段
        function renderField(value, template, isArray) {
            if (value === undefined || value === null || value === '') return '';

            if (isArray && Array.isArray(value)) {
                if (value.length === 0) return '';
                var rendered = value.map(v => {
                    var escaped = escapeHtml(v);
                    var fieldHtml = template.replace('{{value}}', escaped);
                    return fieldHtml ? '<span>' + fieldHtml + '</span>' : '';
                }).join(' ');
                return rendered ? '<span class="custom-field-block">' + rendered + '</span>' : '';
            }

            var escaped = escapeHtml(value);
            var fieldHtml = template.replace('{{value}}', escaped);
            return fieldHtml ? '<span class="custom-field-block">' + fieldHtml + '</span>' : '';
        }

        function renderLayoutTemplatesHtml(templates, data) {
            if (!templates || String(templates.version || '') !== '2') return '';
            if (!templates.layout || !Array.isArray(templates.layout.rows)) return '';
            if (!data) return '';
            var html = '';
            templates.layout.rows.forEach(function(row) {
                if (!row || !Array.isArray(row.blocks)) return;
                var rowParts = [];
                row.blocks.forEach(function(block) {
                    if (!block || !block.field) return;
                    var value = getZoteroFieldValue(data, block.field);
                    if (value === undefined || value === '') return;
                    var tpl = block.template || '{{value}}';
                    var isArray = block.field === 'tags' || block.field === 'creators';
                    var rendered = renderField(value, tpl, isArray);
                    if (rendered) rowParts.push(rendered);
                });
                if (rowParts.length > 0) {
                    html += '<div class="custom-field-row">' + rowParts.join(' ') + '</div>';
                }
            });
            return html;
        }

        function buildCreateNoteUrl(title, type, year, author, linkZotero, linkPdf, linkWeb, linkCloudPdf, itemKey, mode, uid, apiKey, data, templates) {
            var q = [
                'title=' + encodeURIComponent(title),
                'type=' + encodeURIComponent(type || ''),
                'year=' + encodeURIComponent(year || ''),
                'author=' + encodeURIComponent(author || ''),
                'lZ=' + encodeURIComponent(linkZotero || ''),
                'itemKey=' + encodeURIComponent(itemKey || ''),
                'mode=' + encodeURIComponent(mode || ''),
                'uid=' + encodeURIComponent(uid || ''),
                'key=' + encodeURIComponent(apiKey || '')
            ];

            if (templates && data) {
                var customFieldsHtml = renderLayoutTemplatesHtml(templates, data);
                if (customFieldsHtml) {
                    q.push('templatesHtml=' + encodeURIComponent(customFieldsHtml));
                }
            }

            if (linkPdf) q.push('lP=' + encodeURIComponent(linkPdf));
            if (linkWeb) q.push('lW=' + encodeURIComponent(linkWeb));
            if (linkCloudPdf) q.push('lC=' + encodeURIComponent(linkCloudPdf));
            return 'mnzotero://createNote?' + q.join('&');
        }

        function buildPdfLinks(slug, attachmentKey) {
            var safeSlug = slug || 'user';
            var safeAttachmentKey = attachmentKey || '';
            if (!safeAttachmentKey) return { linkPdf: '', linkCloudPdf: '' };
            return {
                linkPdf: 'zotero://open-pdf/library/items/' + safeAttachmentKey,
                linkCloudPdf: 'https://www.zotero.org/' + safeSlug + '/items/' + safeAttachmentKey + '/file'
            };
        }

        function buildDownloadPdfUrl(uid, attachmentKey, title, apiKey, requestId) {
            var q = [
                'uid=' + encodeURIComponent(uid || ''),
                'attachmentKey=' + encodeURIComponent(attachmentKey || ''),
                'fileName=' + encodeURIComponent(title || T('Untitled')),
                'requestId=' + encodeURIComponent(requestId || '')
            ];
            if (apiKey) q.push('key=' + encodeURIComponent(apiKey));
            return 'mnzotero://downloadPdf?' + q.join('&');
        }

        function buildDownloadPdfIcon() {
            return '<svg class="pdf-download-icon" viewBox="0 0 100 100" aria-hidden="true"><g class="pdf-rotor"><rect width="100" height="100" rx="8" fill="#E53935"></rect><text x="50%" y="52%" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">PDF</text><circle class="pdf-download-badge" cx="80" cy="80" r="12" fill="white"></circle><path class="pdf-download-mark" d="M80 73 V85 M75 80 L80 85 L85 80" stroke="#E53935" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>';
        }

        function buildImportAnnotationsIcon() {
            return '<svg class="import-annotations-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path><circle cx="19" cy="19" r="4.5" fill="white" stroke="none"></circle><path d="M19 16.5v5M16.5 19h5" stroke-width="2"></path></svg>';
        }

        var ACTION_BTN_SIZE = 36;
        var ACTION_BTN_GAP = 6;

        function getActionButtonElements(actionContainer) {
            if (!actionContainer) return [];
            return Array.prototype.filter.call(actionContainer.children, function (el) {
                if (!el || !el.classList) return false;
                if (el.style && el.style.display === 'none') return false;
                return el.classList.contains('add-to-mn-btn') || el.classList.contains('open-in-mn-btn') || el.classList.contains('import-annotations-btn');
            });
        }

        function calcActionColumns(buttonCount, listItemWidth) {
            if (buttonCount <= 1) return 1;
            var maxPanelWidth = Math.floor((listItemWidth || 0) / 3);
            var widthForCols = function (cols) {
                return ACTION_BTN_SIZE * cols + ACTION_BTN_GAP * Math.max(0, cols - 1);
            };

            if (buttonCount === 2) {
                return widthForCols(2) <= maxPanelWidth ? 2 : 1;
            }
            if (buttonCount === 3) {
                return widthForCols(3) <= maxPanelWidth ? 3 : 1;
            }
            if (buttonCount === 4) {
                return widthForCols(2) <= maxPanelWidth ? 2 : 1;
            }
            return 1;
        }

        function layoutActionButtons(actionContainer) {
            if (!actionContainer) return;
            var listItem = actionContainer.closest('.list-item');
            var buttons = getActionButtonElements(actionContainer);
            var count = buttons.length;
            if (count <= 0) return;

            var cols = calcActionColumns(count, listItem ? listItem.clientWidth : 0);
            var width = ACTION_BTN_SIZE * cols + ACTION_BTN_GAP * Math.max(0, cols - 1);

            actionContainer.style.width = width + 'px';
            actionContainer.setAttribute('data-btn-count', String(count));
            actionContainer.setAttribute('data-btn-cols', String(cols));
        }

        function relayoutAllActionButtons() {
            var list = document.querySelectorAll('.list-item-actions');
            Array.prototype.forEach.call(list, function (actionContainer) {
                layoutActionButtons(actionContainer);
            });
        }

        function insertActionButtonsBeforeAdd(actionContainer, html) {
            if (!actionContainer || !html) return;
            var addBtn = actionContainer.querySelector('.add-to-mn-btn:not(.download-pdf-btn)');
            if (addBtn && addBtn.insertAdjacentHTML) {
                addBtn.insertAdjacentHTML('beforebegin', html);
            } else {
                actionContainer.insertAdjacentHTML('beforeend', html);
            }
        }

        window.addEventListener('resize', function () {
            relayoutAllActionButtons();
        });

        var __mnDownloadPending = {};
        var __mnSeq = 0;

        function createMNRequestId() {
            __mnSeq += 1;
            return 'mn_dl_' + Date.now() + '_' + __mnSeq;
        }

        function sendMNProtocol(url) {
            var iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = url;
            document.body.appendChild(iframe);
            setTimeout(function () { try { iframe.remove(); } catch (e) { } }, 600);
        }

        window.onMNFavoritesList = function() {
            var payload = parseFavoritesPayload(window.__mnFavoritesPayload);
            var nextSet = new Set();
            payload.items.forEach(function(entry) {
                if (!entry || !entry.itemKey) return;
                nextSet.add(String(entry.itemKey));
            });
            window.MNFavoritesSet = nextSet;
            if (window.__mnFavoritesResolver) {
                var fn = window.__mnFavoritesResolver;
                window.__mnFavoritesResolver = null;
                fn(payload);
            }
        };

        window.onMNBatchImportResult = function() {
            var result = window.__mnBatchImportResult || { success: 0, skipped: 0, failed: 0 };
            var text = T('batch_import_success') + '，' + T('batch_import_report', {
                success: String(result.success || 0),
                skipped: String(result.skipped || 0),
                failed: String(result.failed || 0)
            });
            var logEl = $('log');
            if (logEl) {
                logEl.style.display = 'block';
                logEl.innerText = text;
            }
        };

        function upsertFavoriteEntry(entry) {
            if (!entry || !entry.itemKey) return;
            var payload = encodeURIComponent(JSON.stringify(entry));
            sendMNProtocol('mnzotero://favorites?action=upsert&payload=' + payload);
        }

        function startDownloadButtonMotion(btn) {
            var rotor = btn.querySelector('.pdf-rotor');
            if (!rotor) return null;
            var downloadMark = btn.querySelector('.pdf-download-mark');
            btn.classList.remove('is-finishing', 'is-success', 'is-failed');
            btn.classList.add('is-downloading');
            if (downloadMark) downloadMark.style.opacity = '0';
            rotor.style.animation = 'none';
            rotor.offsetHeight;
            rotor.style.animation = 'mn-download-spin 0.9s linear infinite';
            return { rotor: rotor };
        }

        function finishDownloadButtonMotion(btn, state, ok) {
            if (!btn) return;
            btn.classList.add('is-finishing');
            if (ok) btn.classList.add('is-success');
            else btn.classList.add('is-failed');
            setTimeout(function () {
                var rotor = state && state.rotor ? state.rotor : btn.querySelector('.pdf-rotor');
                var downloadMark = btn.querySelector('.pdf-download-mark');
                if (rotor) {
                    rotor.style.animation = 'none';
                    rotor.style.transform = 'rotate(0deg)';
                }
                if (downloadMark) downloadMark.style.opacity = '';
                btn.classList.remove('is-downloading', 'is-finishing', 'is-success', 'is-failed');
            }, 350);
        }

        function findDownloadButton(node) {
            var current = node;
            while (current && current !== document) {
                if (current.classList && current.classList.contains('download-pdf-btn')) return current;
                current = current.parentNode;
            }
            return null;
        }

        window.onMNDownloadResult = function (requestId, ok, errorMsg) {
            var entry = __mnDownloadPending[requestId];
            if (!entry) return;
            delete __mnDownloadPending[requestId];
            finishDownloadButtonMotion(entry.button, entry.motion, !!ok);
        };

        document.addEventListener('click', function (event) {
            var btn = findDownloadButton(event.target);
            if (!btn) return;
            event.preventDefault();
            if (btn.classList.contains('is-downloading')) return;

            var uid = btn.getAttribute('data-uid') || '';
            var attachmentKey = btn.getAttribute('data-attachment-key') || '';
            var fileName = btn.getAttribute('data-file-name') || 'Untitled';
            var apiKey = btn.getAttribute('data-api-key') || '';
            if (!uid || !attachmentKey) return;

            var requestId = createMNRequestId();
            var motion = startDownloadButtonMotion(btn);
            __mnDownloadPending[requestId] = { button: btn, motion: motion };
            setTimeout(function () {
                var stale = __mnDownloadPending[requestId];
                if (!stale) return;
                delete __mnDownloadPending[requestId];
                finishDownloadButtonMotion(stale.button, stale.motion, false);
            }, 45000);

            var downloadUrl = buildDownloadPdfUrl(uid, attachmentKey, fileName, apiKey, requestId);
            sendMNProtocol(downloadUrl);
        }, false);

        document.addEventListener('click', function(event) {
            var btn = event.target.closest('.favorite-btn');
            if (!btn) return;
            event.preventDefault();
            event.stopPropagation();
            var itemKey = btn.getAttribute('data-item-key') || '';
            if (!itemKey) return;
            var payloadRaw = btn.getAttribute('data-entry-payload') || '';
            if (!payloadRaw) return;
            var entry = null;
            try {
                entry = JSON.parse(decodeURIComponent(payloadRaw));
            } catch (e) {
                entry = null;
            }
            if (!entry) return;
            var isFavorite = window.MNFavoritesSet.has(itemKey);
            sendMNProtocol('mnzotero://favorites?action=toggle&payload=' + encodeURIComponent(JSON.stringify(entry)));
            if (isFavorite) window.MNFavoritesSet.delete(itemKey);
            else window.MNFavoritesSet.add(itemKey);
            updateFavoriteButtonUI(itemKey, !isFavorite);
        }, false);

        document.body.addEventListener('click', function(event) {
            var row = event.target.closest('#out .list-item[data-item-key]');
            if (!row) return;
            if (isInteractiveTarget(event.target)) return;
            var itemKey = row.getAttribute('data-item-key') || '';
            toggleLibrarySelectionByKey(itemKey);
        });

        // Native callbacks for Document Check
        // Global callback for single document check (Local mode)
        window.onMNDocumentCheck = function(attachmentKey, docMd5) {
            var btn = document.querySelector('.open-in-mn-btn[data-attachment-key="' + attachmentKey + '"]');
            if (!btn) return;

            btn.classList.remove('loading');
            if (docMd5) {
                var innerSVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
                btn.innerHTML = innerSVG;
                btn.dataset.docMd5 = docMd5;
            } else {
                // Failure / No Match -> hide button
                btn.style.display = 'none';
            }
            var listItem = btn.closest('.list-item');
            if (listItem) {
                var itemKey = listItem.getAttribute('data-item-key') || '';
                var encoded = listItem.getAttribute('data-favorite-entry') || '';
                if (encoded) {
                    try {
                        var entry = JSON.parse(decodeURIComponent(encoded));
                        entry.docMd5 = docMd5 ? String(docMd5) : '';
                        entry.attachmentKey = attachmentKey || entry.attachmentKey || '';
                        listItem.setAttribute('data-favorite-entry', encodeURIComponent(JSON.stringify(entry)));
                        if (itemKey && window.MNFavoritesSet.has(itemKey)) {
                            upsertFavoriteEntry(entry);
                        }
                    } catch (e) { }
                }
            }
            layoutActionButtons(btn.closest('.list-item-actions'));
        };

        window.onMNDocumentCheckBatch = function(results) {
            // results is a map of attachmentKey -> docMd5 (or null)
            Object.keys(results).forEach(function(key) {
                window.onMNDocumentCheck(key, results[key]);
            });
        };

        // Click handler for eye button to open document
        document.body.addEventListener('click', function (event) {
            var btn = event.target.closest('.open-in-mn-btn');
            if (!btn || btn.classList.contains('loading')) return;
            event.preventDefault();
            var docMd5 = btn.dataset.docMd5;
            if (docMd5) {
                sendMNProtocol('mnzotero://openDocument?docMd5=' + encodeURIComponent(docMd5));
            }
        });

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.batch-import-group')) {
                var menu = $('library-batch-options-menu');
                if (menu) menu.classList.add('hidden');
            }
        });

        async function loadItemAttachments(item, actionContainer) {
            var cfg = window.__mnConfig || {};
            var uid = cfg.uid || '0';
            var key = cfg.key || '';
            var slug = cfg.slug || '';
            var base = '/users/' + uid;
            var d = item.data;
            var hasPdf = false;
            var hasPdfAnnotations = false;
            var attachmentKey = '';
            var pdfFilename = '';
            
            try {
                var r_kids = await smartFetch(base + '/items/' + d.key + '/children', { forceCloud: true });
                if (!r_kids.ok) return;
                var kids = await r_kids.json();
                
                var p = kids.find(function (k) { return k.data.itemType === 'attachment' && (k.data.contentType === 'application/pdf' || (k.data.filename || '').endsWith('.pdf')); });
                if (p) {
                    var pdf = p.data.key;
                    hasPdf = true;
                    attachmentKey = pdf;
                    pdfFilename = p.data.filename || d.title || T('Untitled');
                    var safeKey = String(key || '').replace(/"/g, '"');
                    
                    // Add Download PDF button
                    var dlBtnHtml = '<a href="#" class="add-to-mn-btn download-pdf-btn" title="' + T('download_pdf') + '" data-uid="' + uid + '" data-attachment-key="' + pdf + '" data-file-name="' + pdfFilename + '" data-api-key="' + safeKey + '">' + buildDownloadPdfIcon() + '</a>';
                    
                    // Add Open in MN button (eye)
                    var eyeBtnHtml = '<button class="open-in-mn-btn loading" data-attachment-key="' + pdf + '" title="Open in MarginNote"></button>';
                    
                    // Update actionContainer
                    insertActionButtonsBeforeAdd(actionContainer, dlBtnHtml + eyeBtnHtml);
                    layoutActionButtons(actionContainer);
                    
                    // Trigger checkDocument for this eye button
                    var eyePayload = {};
                    eyePayload[pdf] = pdfFilename;
                    sendMNProtocol('mnzotero://checkDocuments?payload=' + encodeURIComponent(JSON.stringify(eyePayload)));

                    var links = buildPdfLinks(slug, pdf);
                    var author = (d.creators && d.creators[0] && (d.creators[0].lastName || d.creators[0].name)) || T('unknown');
                    var lItem = 'zotero://select/library/items/' + d.key;
                    var cItem = 'https://www.zotero.org/' + (slug || 'user') + '/items/' + d.key;
                    var refreshedCreateUrl = buildCreateNoteUrl((d.title || T('Untitled')), d.itemType, (d.date || '').substring(0, 4), author, lItem, links.linkPdf, cItem, links.linkCloudPdf, d.key, 'C', uid, key, d, getFieldTemplates());
                    var addBtn = actionContainer.querySelector('.add-to-mn-btn:not(.download-pdf-btn)');
                    if (addBtn) addBtn.href = refreshedCreateUrl;

                    // Now check for annotations under this PDF
                    var r_annos = await smartFetch(base + '/items/' + pdf + '/children?itemType=annotation&limit=1', { forceCloud: true });
                    if (r_annos.ok) {
                        var annos = await r_annos.json();
                        if (annos && annos.length > 0) {
                            var importUrl = 'mnzotero://importAnnotations?parentKey=' + encodeURIComponent(d.key) + '&attachmentKey=' + encodeURIComponent(pdf) + '&uid=' + encodeURIComponent(uid) + '&key=' + encodeURIComponent(key);
                            var importBtnHtml = '<a href="' + importUrl + '" class="import-annotations-btn" title="' + T('import_annotations') + '">' + buildImportAnnotationsIcon() + '</a>';
                            insertActionButtonsBeforeAdd(actionContainer, importBtnHtml);
                            layoutActionButtons(actionContainer);
                            hasPdfAnnotations = true;
                        }
                    }
                }
            } catch (e) {
                console.error('Failed to load attachments for ' + d.key, e);
            }
            var listItem = actionContainer ? actionContainer.closest('.list-item') : null;
            var existingEntry = null;
            if (listItem) {
                var encoded = listItem.getAttribute('data-favorite-entry') || '';
                if (encoded) {
                    try {
                        existingEntry = JSON.parse(decodeURIComponent(encoded));
                    } catch (e) {
                        existingEntry = null;
                    }
                }
            }
            var nextEntry = existingEntry || buildFavoriteEntryPayload(d, {});
            nextEntry.hasPdf = !!hasPdf;
            nextEntry.hasPdfAnnotations = !!hasPdfAnnotations;
            nextEntry.attachmentKey = attachmentKey || '';
            nextEntry.pdfFilename = pdfFilename || '';
            if (hasPdf && attachmentKey) {
                var links = buildPdfLinks(slug, attachmentKey);
                var author = (d.creators && d.creators[0] && (d.creators[0].lastName || d.creators[0].name)) || T('unknown');
                var lItem = 'zotero://select/library/items/' + d.key;
                var cItem = 'https://www.zotero.org/' + (slug || 'user') + '/items/' + d.key;
                var refreshedCreateUrl = buildCreateNoteUrl((d.title || T('Untitled')), d.itemType, (d.date || '').substring(0, 4), author, lItem, links.linkPdf, cItem, links.linkCloudPdf, d.key, 'C', uid, key, d, getFieldTemplates());
                nextEntry.createNoteQuery = refreshedCreateUrl.indexOf('?') > -1 ? refreshedCreateUrl.split('?')[1] : '';
                if (actionContainer) {
                    var addBtn = actionContainer.querySelector('.add-to-mn-btn:not(.download-pdf-btn)');
                    if (addBtn) addBtn.href = refreshedCreateUrl;
                }
            }
            if (listItem) {
                listItem.setAttribute('data-favorite-entry', encodeURIComponent(JSON.stringify(nextEntry)));
            }
            if (window.MNFavoritesSet.has(String(d.key || ''))) {
                upsertFavoriteEntry(nextEntry);
            }
        }

        async function run() {
            const q = $('q').value.trim();
            var cfg = window.__mnConfig || {};
            let uid = cfg.uid || '0';
            let key = cfg.key || '';
            let slug = cfg.slug || '';
            
            const ui = { btn: $('btn'), log: $('log'), out: $('out') };
            ui.btn.disabled = true;
            ui.out.innerHTML = '';
            ui.log.style.display = 'block';
            ui.log.innerText = (typeof T === 'function' ? T('searching') : 'Searching...');
            updateResultCount(0, 0);
            await requestFavoritesList();
            
            if ($('tags-loading-mask')) $('tags-loading-mask').classList.remove('hidden');

            var collectionKey = window.MNCurrentCollection || '';
            var selectedTags = window.MNSelectedTags || [];
            var base = '/users/' + uid;
            var path = collectionKey ? base + '/collections/' + collectionKey + '/items/top' : base + '/items/top';
            var params = ['limit=100'];
            var sortKey = window.MNLibraryControls && window.MNLibraryControls.sort ? String(window.MNLibraryControls.sort) : 'year_desc';
            if (sortKey === 'added_desc') {
                params.push('sort=' + encodeURIComponent('dateAdded'));
                params.push('direction=' + encodeURIComponent('desc'));
            } else if (sortKey === 'added_asc') {
                params.push('sort=' + encodeURIComponent('dateAdded'));
                params.push('direction=' + encodeURIComponent('asc'));
            }
            if (q) params.push('q=' + encodeURIComponent(q));
            for (var ti = 0; ti < selectedTags.length; ti++) { params.push('tag=' + encodeURIComponent(selectedTags[ti])); }
            var url = path + (params.length ? ('?' + params.join('&')) : '');

            try {
                var r1 = await smartFetch(url);
                if (!r1.ok) throw new Error((typeof T === 'function' ? T('connection_failed') : 'Connection failed'));

                const rawJson = await r1.json();
                const sourceItems = rawJson.filter(i => i.data && !['attachment', 'note', 'annotation'].includes(i.data.itemType));
                const items = applyLibraryControls(sourceItems);
                var nextVisibleMap = {};
                items.forEach(function(item) {
                    var keyStr = String((item && item.data && item.data.key) || '');
                    if (keyStr) nextVisibleMap[keyStr] = true;
                });
                var nextSelectedKeys = {};
                Object.keys(window.MNLibrarySelectionState.selectedKeys).forEach(function(keyStr) {
                    if (nextVisibleMap[keyStr] && window.MNLibrarySelectionState.selectedKeys[keyStr]) {
                        nextSelectedKeys[keyStr] = true;
                    }
                });
                window.MNLibrarySelectionState.selectedKeys = nextSelectedKeys;
                window.MNLibrarySelectionState.visibleItemKeys = Object.keys(nextVisibleMap);
                updateLibraryControlText();
                updateActiveFilterSummary();
                updateResultCount(sourceItems.length, items.length);
                updateLibraryBatchImportState();

                var extractedTags = new Set();
                items.forEach(function(item) {
                    if (item.data && Array.isArray(item.data.tags)) {
                        item.data.tags.forEach(function(t) { if (t.tag) extractedTags.add(t.tag); });
                    }
                });
                window.MNAvailableTagsSet = extractedTags;
                var currentSearchTerm = $('tag-filter-input') ? $('tag-filter-input').value : '';
                if (!collectionKey && !selectedTags.length && !q) renderTagsList(null, currentSearchTerm);
                else renderTagsList(extractedTags, currentSearchTerm);

                if (!items.length) { ui.log.innerText = (typeof T === 'function' ? T('no_matches_found') : 'No matches found'); return; }
                ui.log.style.display = 'none';

                var listContainer = document.createElement('div');
                listContainer.className = 'list-container';
                ui.out.appendChild(listContainer);

                items.forEach(function(item) {
                    var d = item.data;
                    var u = (typeof slug !== 'undefined' && slug) ? slug : 'user';
                    var lItem = 'zotero://select/library/items/' + d.key;
                    var cItem = 'https://www.zotero.org/' + u + '/items/' + d.key;
                    
                    var btnsHtml = '<a href="' + lItem + '" class="pill pill-zotero">' + T('open_in_zotero') + '</a>';
                    btnsHtml += '<a href="' + cItem + '" target="_blank" class="pill pill-web">' + T('web') + '</a>';
                    
                    var addTitle = (d.title || T('Untitled')).replace(/"/g, '"');
                    var author = (d.creators && d.creators[0] && (d.creators[0].lastName || d.creators[0].name)) || T('unknown');
                    var fieldTemplates = getFieldTemplates();
                    var favoriteEntry = buildFavoriteEntryPayload(d, {});
                    var favoriteEncoded = encodeURIComponent(JSON.stringify(favoriteEntry));
                    var isFavorite = window.MNFavoritesSet.has(String(d.key || ''));
                    var favoriteBtnHtml = '<button class="favorite-btn' + (isFavorite ? ' active' : '') + '" data-item-key="' + escapeHtml(String(d.key || '')) + '" data-entry-payload="' + favoriteEncoded + '" title="' + (isFavorite ? T('favorite_remove') : T('favorite_add')) + '">' + (isFavorite ? '★' : '☆') + '</button>';
                    
                    // Add URL is built but PDF URLs are unknown yet
                    var createNoteUrl = buildCreateNoteUrl((d.title || T('Untitled')), d.itemType, (d.date || '').substring(0, 4), author, lItem, '', cItem, '', d.key, 'C', uid, key, d, fieldTemplates);
                    
                    var itemEl = document.createElement('div');
                    itemEl.className = 'list-item' + (window.MNLibrarySelectionState.selectedKeys[String(d.key || '')] ? ' is-selected' : '');
                    itemEl.setAttribute('data-item-key', String(d.key || ''));
                    itemEl.setAttribute('data-favorite-entry', favoriteEncoded);
                    itemEl.innerHTML = `
                        <div class="list-item-body">
                            <div class="list-title-row">${favoriteBtnHtml}<div class="list-title">${escapeHtml(addTitle)}</div></div>
                            <div class="meta-row">
                                <span>${escapeHtml(author)}</span>
                                <span>${escapeHtml(d.date || '')}</span>
                                <span class="item-type-tag">${escapeHtml(d.itemType)}</span>
                            </div>
                            <div class="action-row">${btnsHtml}</div>
                        </div>
                        <div class="list-item-actions">
                            <a href="${createNoteUrl}" class="add-to-mn-btn" title="${T('add_to_mn')}">+</a>
                        </div>
                    `;
                    listContainer.appendChild(itemEl);
                    
                    // Async load attachments
                    var actionContainer = itemEl.querySelector('.list-item-actions');
                    layoutActionButtons(actionContainer);
                    loadItemAttachments(item, actionContainer);
                });

                syncLibrarySelectedRows();

            } catch (e) { 
                ui.log.innerText = 'Error: ' + e.message;
                updateResultCount(0, 0);
            }
            finally { 
                ui.btn.disabled = false; 
                if ($('tags-loading-mask')) $('tags-loading-mask').classList.add('hidden');
            }
        }
    </script>
</body>
