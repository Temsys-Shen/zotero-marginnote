<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Zotero Connector - Settings</title>
    <link rel="stylesheet" href="common.css">
    <script src="i18n.js"></script>
</head>

<body>

    <header>
        <div class="view-switcher">
            <span class="view-option" data-view="library" role="button">Library</span>
            <span class="view-option" data-view="favorites" role="button">Favorites</span>
            <span class="view-option" data-view="selected" role="button">Selected Cards</span>
            <span class="view-option active" role="button">Settings</span>
        </div>
    </header>

    <main class="settings-main">
        <div id="settings-view" class="settings-layout">
            <nav class="settings-sidebar" aria-label="Settings">
                <div class="settings-nav-item active" role="button" data-target="settings-section-api">API</div>
                <div class="settings-nav-item" role="button" data-target="settings-section-templates">Templates</div>
                <div class="settings-nav-item" role="button" data-target="settings-section-onboarding">Onboarding</div>
            </nav>

            <div class="settings-content">
                <section id="settings-section-api" class="settings-section">
                    <h2 class="settings-section-title" id="settings-title-api">API</h2>
                    <input type="hidden" id="mode" value="C">
                    
                    <div class="status-lights">
                        <div class="status-item tooltip-container" id="local-status-container">
                            <span class="status-light" id="local-light"></span>
                            <span id="settings-local-status-label">Local Status</span>:
                            <span id="local-status-text">--</span>
                            <span class="tooltip-text" id="local-api-tooltip">Hint...</span>
                        </div>
                        <div class="status-item">
                            <span class="status-light" id="cloud-light"></span>
                            <span id="settings-cloud-status-label">Cloud Status</span>:
                            <span id="cloud-status-text">--</span>
                        </div>
                    </div>
                    <input id="uid" placeholder="UserID">
                    <input id="slug" placeholder="Username">
                    <div class="password-container">
                        <input id="key" type="password" placeholder="API Key">
                        <span class="toggle-password" onclick="togglePasswordVisibility()"></span>
                    </div>

                    <div class="api-actions">
                        <button type="button" id="btn-api-check" class="api-action-btn secondary" onclick="checkApiConnection()">检查链接</button>
                        <button type="button" id="btn-api-save" class="api-action-btn primary" onclick="saveApiConfig()">确认保存</button>
                    </div>
                    <p id="api-action-status" class="api-action-status" style="display:none"></p>
                </section>

                <section id="settings-section-templates" class="settings-section" style="display:none">
                    <div class="settings-templates-head">
                        <h2 class="settings-section-title" id="settings-title-templates">Templates</h2>
                        <p class="field-templates-desc">Configure how Zotero fields are displayed in MarginNote cards.</p>
                    </div>
                    <div class="field-templates-panel">
                        <div class="template-builder" id="template-builder">
                            <div class="template-field-palette">
                                <div class="template-palette-head">
                                    <h4 id="template-palette-title">Field Library</h4>
                                    <div class="field-lang-switch" id="field-lang-switch">
                                        <button type="button" class="field-lang-btn active" data-lang="zh">中文</button>
                                        <button type="button" class="field-lang-btn" data-lang="en">English</button>
                                    </div>
                                </div>
                                <p class="template-palette-desc" id="template-palette-desc">Drag a field into rows on the right side.</p>
                                <div class="field-palette-list" id="field-palette-list"></div>
                            </div>
                            <div class="template-layout-workspace">
                                <div class="template-layout-toolbar">
                                    <button id="add-layout-row" class="btn-add-row">+ Add Row</button>
                                </div>
                                <div class="template-layout-canvas" id="template-layout-canvas"></div>
                            </div>
                        </div>
                    </div>
                    <div class="template-modal hidden" id="template-editor-modal" aria-hidden="true">
                        <div class="template-modal-backdrop" id="template-editor-backdrop"></div>
                        <div class="template-modal-card" role="dialog" aria-modal="true" aria-labelledby="template-editor-title">
                            <h3 id="template-editor-title">Edit Template</h3>
                            <p class="template-modal-field" id="template-editor-field-label">Field</p>
                            <textarea id="template-editor-input" class="template-editor-input" rows="5"></textarea>
                            <div class="template-modal-actions">
                                <button type="button" id="template-editor-cancel" class="template-modal-btn secondary">Cancel</button>
                                <button type="button" id="template-editor-save" class="template-modal-btn primary">Save</button>
                            </div>
                        </div>
                    </div>
                </section>

                <section id="settings-section-onboarding" class="settings-section" style="display:none">
                    <h2 class="settings-section-title" id="settings-title-onboarding">Onboarding</h2>
                    <button id="btn-open-onboarding" class="btn-open-onboarding" onclick="openOnboardingFromSettings()">查看新手引导</button>
                </section>
            </div>
        </div>
    </main>

    <script src="common.js"></script>
    <script src="onboarding.js"></script>
    <script>
        // 初始化settings页翻译
        (function initSettingsI18n() {
            var viewOptions = document.querySelectorAll('.view-option');
            viewOptions.forEach(function(opt, idx) {
                var values = [T('library'), T('favorites'), T('selected_cards'), T('settings')];
                if (idx < values.length) opt.textContent = values[idx];
            });

            var modeOptions = document.querySelectorAll('.mode-option');
            modeOptions.forEach(function(opt, idx) {
                var values = [T('local_api'), T('cloud_api')];
                if (idx < values.length) opt.textContent = values[idx];
            });

            var uidEl = document.getElementById('uid');
            var slugEl = document.getElementById('slug');
            var keyEl = document.getElementById('key');
            if (uidEl) uidEl.placeholder = T('user_id');
            if (slugEl) slugEl.placeholder = T('username');
            if (keyEl) keyEl.placeholder = T('api_key');
            var apiModeNotice = document.getElementById('api-mode-notice');
            if (apiModeNotice) apiModeNotice.textContent = T('local_api_limit_notice');

            var openOnboardingBtn = document.getElementById('btn-open-onboarding');
            if (openOnboardingBtn) openOnboardingBtn.textContent = T('reopen_onboarding');

            var checkBtn = document.getElementById('btn-api-check');
            if (checkBtn) checkBtn.textContent = T('check_link');
            var saveBtn = document.getElementById('btn-api-save');
            if (saveBtn) saveBtn.textContent = T('confirm_save');

            var navItems = document.querySelectorAll('.settings-nav-item');
            navItems.forEach(function(item) {
                var target = item.getAttribute('data-target');
                if (target === 'settings-section-api') item.textContent = T('settings_nav_api');
                if (target === 'settings-section-templates') item.textContent = T('settings_nav_templates');
                if (target === 'settings-section-onboarding') item.textContent = T('settings_nav_onboarding');
            });

            var localStatusLabel = document.getElementById('settings-local-status-label');
            var cloudStatusLabel = document.getElementById('settings-cloud-status-label');
            if (localStatusLabel) {
                localStatusLabel.textContent = T('local_status');
            }
            if (cloudStatusLabel) cloudStatusLabel.textContent = T('cloud_status');

            // Set custom CSS tooltip text
            var localTooltip = document.getElementById('local-api-tooltip');
            if (localTooltip) localTooltip.textContent = T('local_api_hint');

            var titleApi = document.getElementById('settings-title-api');
            if (titleApi) titleApi.textContent = T('settings_nav_api');
            var titleTemplates = document.getElementById('settings-title-templates');
            if (titleTemplates) titleTemplates.textContent = T('settings_nav_templates');
            var titleOnboarding = document.getElementById('settings-title-onboarding');
            if (titleOnboarding) titleOnboarding.textContent = T('settings_nav_onboarding');

            var desc = document.querySelector('.field-templates-desc');
            if (desc) desc.textContent = T('field_templates_desc');

            var paletteTitle = document.getElementById('template-palette-title');
            if (paletteTitle) paletteTitle.textContent = T('template_field_library');
            var fieldLangZh = document.querySelector('.field-lang-btn[data-lang="zh"]');
            if (fieldLangZh) fieldLangZh.textContent = T('field_lang_zh');
            var fieldLangEn = document.querySelector('.field-lang-btn[data-lang="en"]');
            if (fieldLangEn) fieldLangEn.textContent = T('field_lang_en');
            var paletteDesc = document.getElementById('template-palette-desc');
            if (paletteDesc) paletteDesc.textContent = T('template_drag_hint');
            var addRowBtn = document.getElementById('add-layout-row');
            if (addRowBtn) addRowBtn.textContent = T('add_row');
            var modalTitle = document.getElementById('template-editor-title');
            if (modalTitle) modalTitle.textContent = T('template_edit_title');
            var modalCancel = document.getElementById('template-editor-cancel');
            if (modalCancel) modalCancel.textContent = T('template_edit_cancel');
            var modalSave = document.getElementById('template-editor-save');
            if (modalSave) modalSave.textContent = T('template_edit_save');
            
            // 显示 settings-view
            var settingsView = document.getElementById('settings-view');
            if (settingsView) settingsView.style.display = 'flex';
        })();

        // Settings sidebar navigation
        (function initSettingsSidebar() {
            var navItems = document.querySelectorAll('.settings-nav-item');
            var sections = document.querySelectorAll('.settings-section');
            if (!navItems.length || !sections.length) return;

            function show(targetId) {
                sections.forEach(function(sec) {
                    if (sec.id !== targetId) {
                        sec.style.display = 'none';
                        return;
                    }
                    if (sec.id === 'settings-section-templates') sec.style.display = 'flex';
                    else sec.style.display = 'block';
                });
                navItems.forEach(function(item) {
                    var active = item.getAttribute('data-target') === targetId;
                    if (active) item.classList.add('active');
                    else item.classList.remove('active');
                });
                try { localStorage.setItem('mn_zotero_settings_nav', targetId); } catch (e) {}
            }

            navItems.forEach(function(item) {
                item.addEventListener('click', function() {
                    var target = this.getAttribute('data-target');
                    if (target) show(target);
                });
            });

            var initial = 'settings-section-api';
            try {
                var saved = localStorage.getItem('mn_zotero_settings_nav');
                if (saved) initial = saved;
            } catch (e) {}
            show(initial);
        })();

        // View switcher logic for settings page
        (function initSettingsSwitcher() {
            var viewOptions = document.querySelectorAll('.view-option[data-view]');
            viewOptions.forEach(function(el) {
                el.addEventListener('click', function() {
                    var view = this.getAttribute('data-view');
                    if (view === 'library') {
                        window.location.href = 'library.html';
                    } else if (view === 'favorites') {
                        window.location.href = 'favorites.html';
                    } else if (view === 'selected') {
                        window.location.href = 'selection.html';
                    }
                });
            });
        })();

        (function initLocalStatusTooltip() {
            var container = document.getElementById('local-status-container');
            if (!container) return;
            var toggle = function(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                var opened = container.classList.contains('show-tooltip');
                if (opened) container.classList.remove('show-tooltip');
                else container.classList.add('show-tooltip');
            };

            container.addEventListener('click', toggle);
            container.addEventListener('touchstart', toggle, { passive: false });

            document.addEventListener('click', function(e) {
                if (!container.classList.contains('show-tooltip')) return;
                if (!container.contains(e.target)) container.classList.remove('show-tooltip');
            });
            document.addEventListener('touchstart', function(e) {
                if (!container.classList.contains('show-tooltip')) return;
                if (!container.contains(e.target)) container.classList.remove('show-tooltip');
            }, { passive: true });
        })();
    </script>
</body>

</html>
